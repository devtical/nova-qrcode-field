name: Format

on: [push, pull_request]

permissions:
    contents: write

jobs:
    pint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.head_ref }}

            - name: Run Pint
              uses: aglipanci/laravel-pint-action@v2
              with:
                  preset: laravel
                  configPath: "pint.json"

            - name: Commit changes
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: Fix styling
